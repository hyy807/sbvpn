name: Build Android APK

# Official SagerNet Android client, unchanged; THIS repository supplies the patched core.
# Pairing: testing libbox API + official dev client 1.15.0-alpha.12 (not stable 1.14.3).
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_CLIENT_COMMIT: bc73504fcb858400a939140ad785ed92f4c9f429

jobs:
  apk:
    name: sbvpn core → official Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out sbvpn core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify vendored official Android source
        run: |
          test "$(cat clients/android/.upstream-commit)" = "$ANDROID_CLIENT_COMMIT"
          test -f clients/android/gradlew
          test -f clients/android/app/build.gradle.kts

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install OpenJDK 17 (required by official libbox builder)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact Android SDK and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          # Avoid masking sdkmanager failure or treating yes's SIGPIPE as an SDK failure.
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0" "ndk;28.0.13004108"
          test -f "$ANDROID_HOME/licenses/android-sdk-license"
          test -f "$ANDROID_HOME/ndk/28.0.13004108/source.properties"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build both official libbox variants, with all default ABIs and tags
        run: |
          mkdir -p android-logs
          make lib_install 2>&1 | tee android-logs/lib-install.log
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android 2>&1 | tee android-logs/libbox.log
          test -s libbox.aar
          test -s libbox-legacy.aar
          mkdir -p clients/android/app/libs
          cp libbox.aar libbox-legacy.aar clients/android/app/libs/

      - name: Build complete official other and legacy clients (debug signing)
        run: |
          # No upstream release key is available. Debug is installable and does not remove features.
          # The release path upstream is assembleOtherRelease + assembleOtherLegacyRelease.
          cd clients/android
          ./gradlew :app:clean :app:assembleOtherDebug :app:assembleOtherLegacyDebug --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/android-logs/gradle.log"
          git diff --exit-code

      - name: Verify every APK and collect provenance
        run: |
          python3 scripts/android_verify.py clients/android output/android
          for apk in output/android/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" >> android-logs/signatures.log
            "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" >> android-logs/packages.log
          done
          cp android-logs/signatures.log android-logs/packages.log output/android/

      - name: Upload verified APKs and provenance
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-apk
          path: output/android/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: android-logs/
          retention-days: 30

      - name: Publish verified build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${GITHUB_RUN_ID}" output/android/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Android APK (run ${GITHUB_RUN_ID})" \
            --notes "Unmodified official SagerNet Android client $ANDROID_CLIENT_COMMIT; sbvpn patched core $GITHUB_SHA. Complete other/API24 and legacy/API21 variants, all four ABIs and universal APKs. Debug-signed (not SagerNet's release signing key). Provenance and SHA256SUMS included."
