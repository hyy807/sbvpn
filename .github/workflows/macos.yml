name: Build macOS official standalone GUI (sbvpn core)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Official SFM.System + sbvpn core (unsigned staging package)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      APPLE_CLIENT_COMMIT: 56681841de346fb2185dc6eceba415f6b41bb2b2
      GOTOOLCHAIN: local
      DISABLE_SWIFTLINT: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out sbvpn core (do not use modified Apple gitlink)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify vendored official Apple source and dependencies
        run: |
          set -euo pipefail
          mkdir -p output/logs
          test -f clients/apple/Makefile
          test -f clients/apple/HelperService/RootHelperService.swift
          test -f clients/apple/Frameworks/Runestone/Package.swift
          # Parent vendors this exact official revision; no network client checkout.
          printf '%s\n' "$APPLE_CLIENT_COMMIT" > output/apple-client-commit.txt
          git rev-parse HEAD > output/core-commit.txt
          cp clients/apple/sing-box.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved output/Package.resolved
          cp scripts/macos/README.md output/BUILD-NOTES.md

      - name: Install official Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Build framework and official standalone package
        run: bash scripts/macos/build.sh

      - name: Upload installable package and build evidence before release
        uses: actions/upload-artifact@v4
        with:
          name: sbvpn-macos-official-standalone-unsigned
          path: |
            output/*.pkg
            output/*.txt
            output/*.json
            output/*.resolved
            output/*.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish staging release (artifact already preserved)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" output/*.pkg output/SHA256SUMS.txt output/BUILD-NOTES.md \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "sbvpn official macOS GUI — unsigned staging build" \
            --notes "Pinned unmodified SagerNet Apple SFM.System client with sbvpn core. Unsigned/unnotarized PKG for signing and inspection, NOT a working VPN distribution: NetworkExtension/system-extension entitlements and helper XPC require real matching Apple signing identities/profiles. See BUILD-NOTES.md."

      - name: Upload complete build logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbvpn-macos-build-logs-${{ github.run_attempt }}
          path: output/logs/
          if-no-files-found: warn
          retention-days: 30
