name: Build Windows Installer

# Builds official sing-box-for-desktop (Electron NSIS) with sbvpn patched core.
# Desktop client's package.ts calls findBoxDirectory() which checks ../sing-box,
# so we junction the sbvpn checkout there. It then runs build_boxdd itself.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: sbvpn core → Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out sbvpn core
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone desktop client as sibling
        shell: bash
        run: |
          git clone --depth 1 https://github.com/hyy807/sing-box-for-desktop.git ../sing-box-for-desktop
          echo "client: $(git -C ../sing-box-for-desktop log --oneline -1)"

      - name: Junction sbvpn source so desktop client can find it
        shell: pwsh
        run: |
          $target = $env:GITHUB_WORKSPACE
          $parent = Split-Path $target -Parent
          $link = Join-Path $parent "sing-box"
          New-Item -ItemType Junction -Path $link -Target $target -Force
          Write-Host "Junction: $link -> $target"
          Test-Path (Join-Path $link "go.mod")

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go toolchain deps
        run: make lib_install

      - name: Build Windows installer
        working-directory: ../sing-box-for-desktop
        shell: bash
        run: |
          pnpm install
          pnpm package:win
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p output
          find ../sing-box-for-desktop/release -name "*.exe" ! -name "*blockmap" -exec cp {} output/ \;
          ls -lh output/ || true

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "win-${GITHUB_RUN_ID}" output/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Windows Installer (run ${GITHUB_RUN_ID})" \
            --notes "NSIS installer. sbvpn patched core with LightXtreme private protocol + official sing-box-for-desktop."

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-windows-installer
          path: output/*.exe
          if-no-files-found: warn
          retention-days: 30
