name: Build Windows official GUI installer (sbvpn core)

# Unmodified vendored SagerNet/sing-box-for-desktop.
# The runtime authenticates GUI, worker and daemon by matching Authenticode
# signer certificates. CI creates one ephemeral self-signed code-signing
# certificate and lets the official electron-builder path sign all components.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DESKTOP_CLIENT_COMMIT: 2c3ba5cabfe039d4f46561218cfb3a2934e40d29
  GOTOOLCHAIN: local

jobs:
  windows:
    name: Official desktop client + sbvpn core (self-signed)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out vendored source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify source layout and provenance
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path output,windows-logs | Out-Null
          if ((Get-Content clients/desktop/.upstream-commit -Raw).Trim() -ne $env:DESKTOP_CLIENT_COMMIT) { throw 'desktop source commit mismatch' }
          foreach ($path in @(
            'clients/desktop/package.json',
            'clients/desktop/scripts/package.ts',
            'clients/desktop/scripts/afterPack.cjs',
            'clients/desktop/dashboard/package.json',
            'cmd/internal/build_boxdd/main.go'
          )) { if (-not (Test-Path $path)) { throw "missing required source: $path" } }
          git rev-parse HEAD | Set-Content output/core-commit.txt
          $env:DESKTOP_CLIENT_COMMIT | Set-Content output/desktop-client-commit.txt
          Get-Content clients/desktop/version.json | Set-Content output/desktop-version.json

      - name: Install official Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Install official Node.js requirement
        uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'

      - name: Enable package manager from official package metadata
        run: |
          corepack enable
          corepack prepare pnpm@11.13.0 --activate
          node --version | Tee-Object windows-logs/node-version.log
          pnpm --version | Tee-Object windows-logs/pnpm-version.log
          go version | Tee-Object windows-logs/go-version.log

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Provide semantic core version to official builder
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v1.15.0-alpha.12 "$GITHUB_SHA"
          git describe --tags --match 'v*' | tee windows-logs/core-version.log

      - name: Create ephemeral self-signed code-signing certificate
        run: |
          $ErrorActionPreference = 'Stop'
          $passwordText = [Convert]::ToBase64String([byte[]](1..48 | ForEach-Object { Get-Random -Maximum 256 }))
          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=sbvpn CI Ephemeral Code Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddDays(7)
          Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\clients\desktop\sbvpn-ci.pfx" -Password $securePassword | Out-Null
          @{
            windows = @{
              certificateFile = 'sbvpn-ci.pfx'
              certificatePassword = $passwordText
            }
          } | ConvertTo-Json -Depth 3 | Set-Content clients/desktop/signing.local.json
          $cert.Thumbprint | Set-Content output/code-signing-thumbprint.txt
          "SBVPN_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          if (-not (Test-Path clients/desktop/sbvpn-ci.pfx)) { throw 'PFX export failed' }

      - name: Build complete official Windows clients
        working-directory: clients/desktop
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm install --frozen-lockfile 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\windows-logs\pnpm-install.log"
          pnpm package:win 2>&1 | Tee-Object "$env:GITHUB_WORKSPACE\windows-logs\package.log"

      - name: Verify installers and signed runtime components
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'clients/desktop/release'
          $installers = @(Get-ChildItem $release -Filter 'SFW-*.exe' -File)
          if ($installers.Count -ne 3) { throw "expected 3 NSIS installers, found $($installers.Count)" }
          foreach ($arch in @('win-unpacked','win-ia32-unpacked','win-arm64-unpacked')) {
            $dir = Join-Path $release $arch
            foreach ($relative in @('sing-box.exe','resources\daemon\sing-box-daemon.exe','resources\app.asar')) {
              $path = Join-Path $dir $relative
              if (-not (Test-Path $path)) { throw "missing runtime component: $path" }
            }
            foreach ($relative in @('sing-box.exe','resources\daemon\sing-box-daemon.exe')) {
              $path = Join-Path $dir $relative
              $signature = Get-AuthenticodeSignature $path
              if ($signature.SignerCertificate.Thumbprint -ne $env:SBVPN_CERT_THUMBPRINT) {
                throw "unexpected signer for ${path}: $($signature.SignerCertificate.Thumbprint)"
              }
            }
          }
          New-Item -ItemType Directory -Force -Path output/windows | Out-Null
          $installers | Copy-Item -Destination output/windows
          foreach ($arch in @('win-unpacked','win-ia32-unpacked','win-arm64-unpacked')) {
            Compress-Archive -Path (Join-Path $release $arch) -DestinationPath "output/windows/$arch.zip" -CompressionLevel Optimal
          }
          Get-ChildItem output/windows -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content output/windows/SHA256SUMS.txt
          if ((Get-ChildItem output/windows -Filter '*.exe').Count -ne 3) { throw 'installer collection failed' }

      - name: Remove ephemeral signing material
        if: always()
        run: |
          Remove-Item clients/desktop/sbvpn-ci.pfx,clients/desktop/signing.local.json -Force -ErrorAction SilentlyContinue
          if ($env:SBVPN_CERT_THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:SBVPN_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue }

      - name: Upload verified installers and runtimes
        uses: actions/upload-artifact@v4
        with:
          name: sbvpn-windows-official-self-signed
          path: |
            output/windows/
            output/*commit.txt
            output/desktop-version.json
            output/code-signing-thumbprint.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbvpn-windows-build-logs
          path: windows-logs/
          if-no-files-found: warn
          retention-days: 30
