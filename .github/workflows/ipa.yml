name: Build iOS IPA (restored working recipe)

# Restored from successful run 38549055133 (repository commit 967b8c1e).
# Apple client source is fixed at the exact commit compiled by successful run 38549055133.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    name: restored Apple source + AppGroup patch -> unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out current core
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Verify vendored pre-four-platform Apple client
        run: |
          set -e
          test "$(cat clients/apple-ios/.upstream-commit)" = 56681841de346fb2185dc6eceba415f6b41bb2b2
          test -f clients/apple-ios/Frameworks/Runestone/Package.swift
          test -f clients/apple-ios/SFI/Application.swift
          test "$(git hash-object clients/apple-ios/SFI/Application.swift)" = 44d33185d2feec652247b2ddc9c17d5fd398003d
          test "$(git hash-object clients/apple-ios/SFI/Info.plist)" = 376095ad3632221b05507fbec33726a455caba73
          test "$(git hash-object clients/apple-ios/sing-box.xcodeproj/project.pbxproj)" = f0cbe727d2557e83ce6e92586798929e7444a694
          echo "core: $(git log --oneline -1)"
          echo "client source: 56681841de346fb2185dc6eceba415f6b41bb2b2"

      - name: Inject restored runtime AppGroup resolution
        run: |
          python3 scripts/test_app_groups.py
          python3 scripts/patch_app_groups.py clients/apple-ios

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Libbox.xcframework with restored command
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios
          rm -rf clients/apple-ios/Libbox.xcframework
          cp -R Libbox.xcframework clients/apple-ios/Libbox.xcframework
          du -sh clients/apple-ios/Libbox.xcframework

      - name: Archive SFI with restored settings
        working-directory: clients/apple-ios
        env:
          DISABLE_SWIFTLINT: '1'
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/sing-box-* 2>/dev/null || true
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SFI.xcarchive" \
            -skipPackagePluginValidation \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            BASE_PACKAGE_IDENTIFIER=com.mQaKx.AkyLoyU \
            APP_GROUP_IDENTIFIER=group.57234YHGTV.8FK1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || true
          grep -E "error:|Archive Succeeded|ARCHIVE FAILED" "$RUNNER_TEMP/xcodebuild.log" | head -20 || true
          test -d "$RUNNER_TEMP/SFI.xcarchive" || { echo "=== xcodebuild failed ==="; tail -60 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: Package restored unsigned IPA
        run: |
          set -eu
          app="$RUNNER_TEMP/SFI.xcarchive/Products/Applications/sing-box.app"
          test -d "$app"
          test -d "$app/PlugIns/Extension.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = 'com.mQaKx.AkyLoyU'
          test "$(/usr/libexec/PlistBuddy -c 'Print AppGroupIdentifier' "$app/Info.plist")" = 'group.57234YHGTV.8FK1'
          mkdir -p "$RUNNER_TEMP/ipa/Payload" output
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/sing-box.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/output/sing-box-iOS-unsigned.ipa" Payload)
          unzip -t output/sing-box-iOS-unsigned.ipa
          shasum -a 256 output/sing-box-iOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-iOS-restored-working
          path: output/sing-box-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 30
