name: Build iOS official SFI IPA (sbvpn core)

# The Apple client is vendored in this repository, including Runestone.
# Do not switch branches or patch Swift/AppGroup behavior during the build.
# This unsigned staging IPA requires valid signing for every app/extension.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: Vendored official SFI + sbvpn core (unsigned)
    runs-on: macos-26
    timeout-minutes: 120
    env:
      APPLE_CLIENT_COMMIT: 56681841de346fb2185dc6eceba415f6b41bb2b2
      GOTOOLCHAIN: local
      DISABLE_SWIFTLINT: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out main repository with vendored clients
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Record source provenance and check official client inputs
        run: |
          set -euo pipefail
          mkdir -p output/logs
          test ! -e clients/apple/.git
          test -f clients/apple/sing-box.xcodeproj/project.pbxproj
          test -f clients/apple/sing-box.xcodeproj/xcshareddata/xcschemes/SFI.xcscheme
          test -f clients/apple/Frameworks/Runestone/Package.swift
          test -f .github/patch_go_for_ios.sh
          test -f .github/go_ios_cpu_features.patch
          printf '%s\n' "$APPLE_CLIENT_COMMIT" > output/apple-client-commit.txt
          git rev-parse HEAD > output/core-commit.txt
          cp clients/apple/sing-box.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved output/Package.resolved
          cat output/core-commit.txt output/apple-client-commit.txt
          xcodebuild -version | tee output/logs/xcode-version.log
          xcrun --sdk iphoneos --show-sdk-version | tee output/logs/ios-sdk-version.log

      - name: Install official Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Apply official Go iOS CPU patch (not a client patch)
        run: |
          set -euo pipefail
          go version | tee output/logs/go-version.log
          bash .github/patch_go_for_ios.sh 2>&1 | tee output/logs/go-ios-patch.log

      - name: Build Libbox using the main repository core
        run: |
          set -euo pipefail
          make lib_install 2>&1 | tee output/logs/lib-install.log
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios/arm64 2>&1 | tee output/logs/libbox.log
          test -f Libbox.xcframework/Info.plist
          rm -rf clients/apple/Libbox.xcframework
          cp -R Libbox.xcframework clients/apple/Libbox.xcframework
          du -sh clients/apple/Libbox.xcframework

      - name: Archive normal SFI with all official extensions (unsigned)
        working-directory: clients/apple
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SFI.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/SFI-DerivedData" \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/logs/xcodebuild.log"

      - name: Verify complete SFI archive and package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/SFI.xcarchive/Products/Applications/sing-box.app"
          test -f "$RUNNER_TEMP/SFI.xcarchive/Info.plist"
          test -d "$app"
          for extension in Extension WidgetExtension FileProviderExtension ShareExtension ActionExtension; do
            test -f "$app/PlugIns/$extension.appex/Info.plist"
          done
          test -f "$app/Extensions/IntentsExtension.appex/Info.plist"
          # Libbox is linked by the official Library target, not embedded as a dylib.
          test -d "$app/Frameworks/Library.framework"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist" > output/app-bundle-id.txt
          /usr/libexec/PlistBuddy -c 'Print AppGroupIdentifier' "$app/Info.plist" > output/app-group-id.txt
          mkdir -p "$RUNNER_TEMP/ipa/Payload" output/signing-reference
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/sing-box.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/output/sbvpn-sfi-unsigned.ipa" Payload)
          test -d "$RUNNER_TEMP/SFI.xcarchive/dSYMs"
          ditto -c -k "$RUNNER_TEMP/SFI.xcarchive/dSYMs" output/sbvpn-sfi-dSYMs.zip
          for target in SFI Extension WidgetExtension FileProviderExtension ShareExtension ActionExtension IntentsExtension; do
            mkdir -p "output/signing-reference/$target"
            cp clients/apple/"$target"/*.entitlements "output/signing-reference/$target/"
          done
          printf '%s\n' \
            'Unsigned staging IPA: not an install-ready or verified working VPN distribution.' \
            'Client: unmodified official SagerNet/sing-box-for-apple at the recorded fixed revision; core: this sbvpn repository.' \
            'Normal SFI includes packet tunnel, widget, file provider, share, action and intents extensions. No jailbreak conversion or AppGroup fallback.' \
            'Sign embedded frameworks and all extensions before the main app, using matching identities, bundle IDs and provisioning profiles.' \
            'Profiles must authorize the official AppGroup, NetworkExtension and other target capabilities. Preserve shared group identifiers across targets.' \
            'signing-reference contains upstream entitlement templates, not resolved signing payloads; substitute build settings and use valid profiles.' \
            'Build success does not establish device launch or VPN functionality; correct signing and device validation are still required.' \
            > output/BUILD-NOTES.txt
          unzip -t output/sbvpn-sfi-unsigned.ipa
          shasum -a 256 output/*.ipa output/*dSYMs.zip > output/SHA256SUMS.txt
          cat output/SHA256SUMS.txt
          (cd output && zip -qr sbvpn-sfi-build-evidence.zip *.txt Package.resolved signing-reference)

      - name: Upload IPA and build evidence before release
        uses: actions/upload-artifact@v4
        with:
          name: sbvpn-sfi-unsigned-${{ github.run_attempt }}
          path: |
            output/*.ipa
            output/*.zip
            output/*.txt
            output/Package.resolved
            output/signing-reference/
          if-no-files-found: error
          retention-days: 30


      - name: Upload complete build logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbvpn-sfi-build-logs-${{ github.run_attempt }}
          path: output/logs/
          if-no-files-found: warn
          retention-days: 30
